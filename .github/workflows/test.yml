name: Test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-repro:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: llvm-tools-preview
          cache-shared-key: coverage-cargo-install-v1
      - name: Standard-library-only stream stress test
        run: cargo test -p socketry-executor --test windows_recv --locked -- standard_library_concurrent_reads --exact
      - name: Standard-library-only datagram stress test
        if: always()
        run: cargo test -p socketry-executor --test windows_recv --locked -- udp_concurrent_reads --exact
      - name: Independent receive stress tests
        if: always()
        run: cargo test -p socketry-executor --test windows_recv --locked -- --test-threads=1
      - name: Scheduler receive stress test
        if: always()
        run: cargo test -p socketry-executor --test io --features tokio --locked -- multiple_readers_share_one_registration --test-threads=1
      - name: Install coverage tool
        if: always()
        run: cargo install cargo-llvm-cov --locked
      - name: Coverage receive stress tests
        if: always()
        run: cargo llvm-cov -p socketry-executor --test windows_recv --locked --no-report -- --test-threads=1
      - name: Coverage scheduler stress test
        if: always()
        run: cargo llvm-cov -p socketry-executor --test io --features tokio --locked --no-report -- multiple_readers_share_one_registration --test-threads=1
