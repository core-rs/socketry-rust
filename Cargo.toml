[workspace]
members = ["crates/executor", "crates/timers", "bake"]
resolver = "3"

[workspace.metadata.bake]
manifest = "bake/Cargo.toml"

[workspace.metadata.bake.release]
reviewers = ["socketry/managers"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/socketry/socketry-rust"

[package]
name = "socketry"
version.workspace = true
edition.workspace = true
description = "Foundational concurrency APIs for Socketry"
license.workspace = true
repository.workspace = true
readme = "readme.md"
include = ["Cargo.toml", "readme.md", "license.md", "releases.md", "context/**", "src/**", "examples/**"]

[[example]]
name = "echo-server"
path = "examples/echo/server.rs"
required-features = ["native", "signals"]

[[example]]
name = "echo-client"
path = "examples/echo/client.rs"
required-features = ["native"]

[dependencies]
socketry-executor = { version = "0.2.0", path = "crates/executor", default-features = false }
socketry-timers = { version = "0.2.0", path = "crates/timers" }

[features]
default = ["native"]
native = ["socketry-executor/native"]
io-uring = ["native", "socketry-executor/io-uring"]
tokio = ["socketry-executor/tokio"]
signals = ["socketry-executor/signals"]
