[package]
name = "socketry-executor"
version.workspace = true
edition.workspace = true
description = "Owned asynchronous tasks and a work-stealing future scheduler"
license.workspace = true
repository.workspace = true
readme = "readme.md"
include = ["Cargo.toml", "license.md", "readme.md", "design.md", "src/**", "examples/**"]

[lib]
name = "socketry_executor"
path = "src/lib.rs"

[dependencies]
async-task = "4.7.1"
async-io = { version = "2.6.0", optional = true }
blocking = { version = "1.6.2", optional = true }
crossbeam-deque = "0.8.7"
event-listener = "5.4.2"
futures-channel = "0.3.31"
pin-project-lite = "0.2.17"
tokio = { version = "1.53.1", optional = true, features = ["rt", "net", "fs", "time", "io-util"] }

[target.'cfg(unix)'.dependencies]
signal-hook = { version = "0.4.5", optional = true, default-features = false, features = ["iterator"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2.189", optional = true }
io-uring = { version = "0.7.11", optional = true, features = ["io_safety"] }
polling = { version = "3.11.0", optional = true }

[features]
default = ["native"]
native = ["dep:async-io", "dep:blocking"]
io-uring = ["native", "dep:io-uring", "dep:libc", "dep:polling"]
signals = ["dep:signal-hook"]
tokio = ["dep:tokio"]

[dev-dependencies]
libc = "0.2.189"
futures-lite = "2.6.1"
tempfile = "3"
loom = "0.7.2"
